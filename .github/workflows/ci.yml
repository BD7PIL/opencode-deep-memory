name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install

      - name: Typecheck
        run: npm run typecheck

      # Build BEFORE Test: tests/tools/memory-store.realshape.test.ts loads the
      # built dist on purpose (it validates the artifact a host actually loads),
      # and dist/ is gitignored, so on a clean checkout Test cannot run first.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke test
        run: npm run smoke

      # The v0.14.1 production-bug trio shipped through green unit tests —
      # the real-E2E regression script is the gatekeeper and belongs in CI.
      - name: Real-bug regression (v0.14.1 trio)
        run: npm run e2e:real-bugs

      # The v2 adapter's contract lives in the ENGINE, not in the published SDK
      # types: tools only reach the agent through ctx.tool.transform with a
      # namespace, events arrive as an AsyncIterable, and v2's event names differ
      # from v1's. A mocked host cannot disagree with the adapter's assumptions,
      # so this gate boots a real opencode v2 engine against a stub LLM.
      # Bump this cache key whenever E2E_V2_VERSION changes.
      - name: Cache the opencode v2 engine
        uses: actions/cache@v4
        with:
          path: /tmp/dm-e2e-v2-*
          key: opencode-v2-engine-${{ runner.os }}-2.0.32

      - name: v2 real-engine E2E gate
        run: npm run e2e:v2
