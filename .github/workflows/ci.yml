name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # 每周一 04:00 UTC：跑基准套件（BENCH=1 解锁 tests/benchmark）。基准有
    # 时间断言，不适合 PR 路径（加载中的 CI 机器会晃），但也绝不能烂掉——
    # 这条 cron 是它的看门人。
    - cron: "0 4 * * 1"

env:
  # opencode v2 引擎版本：一处定义。scripts/e2e-v2-lab.mjs 读它做默认值，
  # 下面的缓存 key 也读它——升引擎时只改这一行，缓存 key 跟着走，不会再出现
  # "脚本升了、缓存 key 忘了、每周都当缓存 miss 重下"的漂移。
  E2E_V2_VERSION: "2.0.32"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        # 24 = 主线统一线：门槛锚定、重 E2E、本机开发机与引擎实跑都在这条
        # （EL7 上引擎跑的 node 也是 24.22）；20 = engines 地线兼容腿
        # （package.json engines >=20），只跑单元测试，不锚覆盖率。
        node-version: [20, 24]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci

      - name: Lint (biome, lint-only — formatting is not enforced)
        run: npm run lint

      - name: Public-tree gate (private addresses / developer paths / credential shapes)
        run: node scripts/check-public-tree.mjs --root . --exclude .zcode --exclude coverage

      - name: Public docs links
        run: npm run check:links

      - name: Typecheck
        run: npm run typecheck

      # Build BEFORE Test: tests/tools/memory-store.realshape.test.ts loads the
      # built dist on purpose (it validates the artifact a host actually loads),
      # and dist/ is gitignored, so on a clean checkout Test cannot run first.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Thresholds live in vitest.config.ts coverage.thresholds (hard floor,
      # only ratchets up); vitest exits non-zero when any metric drops below.
      # Main line only: the numbers are anchored to node 24 (dev machine + CI
      # agree), the node-20 floor leg stays test-only.
      - name: Coverage gate (thresholds in vitest.config.ts)
        if: matrix.node-version == 24
        run: npm run test:coverage

      - name: Upload coverage
        if: always() && matrix.node-version == 24
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deep-memory-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Smoke test
        run: npm run smoke

      # The v0.14.1 production-bug trio shipped through green unit tests —
      # the real-E2E regression script is the gatekeeper and belongs in CI.
      # Main line only: these boot real processes, and 24 is the line the
      # engine actually runs on.
      - name: Real-bug regression (v0.14.1 trio)
        if: matrix.node-version == 24
        run: npm run e2e:real-bugs

      # The v2 adapter's contract lives in the ENGINE, not in the published SDK
      # types: tools only reach the agent through ctx.tool.transform with a
      # namespace, events arrive as an AsyncIterable, and v2's event names differ
      # from v1's. A mocked host cannot disagree with the adapter's assumptions,
      # so this gate boots a real opencode v2 engine against a stub LLM.
      # Bump env.E2E_V2_VERSION (top of file) when the engine version changes —
      # the cache key reads the same variable, so they can never drift apart.
      - name: Cache the opencode v2 engine
        if: matrix.node-version == 24
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/dm-e2e-v2-*
          key: opencode-v2-engine-${{ runner.os }}-${{ env.E2E_V2_VERSION }}

      - name: v2 real-engine E2E gate
        if: matrix.node-version == 24
        run: npm run e2e:v2

  # Weekly only (see `schedule:` at the top): the benchmark suite with its
  # timing assertions. Keeps the numbers honest without taxing PR runs.
  # Node 24: benchmark numbers should describe the line the engine runs on.
  bench:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Benchmark suite (BENCH=1)
        run: BENCH=1 npm test
